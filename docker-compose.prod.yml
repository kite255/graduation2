
services:
  # ==========================================
  # FRONTEND — React + Nginx
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "80"

    depends_on:
      - backend

    restart: unless-stopped

  # ==========================================
  # BACKEND — Node.js + Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"

      # Separate Coolify PostgreSQL resource
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

      # Temporary administrator authentication
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}

      # VPS persistent disk storage
      UPLOAD_DIR: /app/uploads

      # Optional: parent domain for graduate subdomains
      SITES_BASE_DOMAIN: ${SITES_BASE_DOMAIN:-}

    expose:
      - "3001"

    volumes:
      - graduation2_uploads:/app/uploads

    restart: unless-stopped

# ==========================================
# PERSISTENT FILE STORAGE
# ==========================================
volumes:
  graduation2_uploads:
