
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "80"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Admin token required}

      UPLOAD_DIR: /app/uploads

    expose:
      - "3001"

    volumes:
      - graduation2_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: graduation2
      POSTGRES_USER: graduation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password required}

    volumes:
      - graduation2_db:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U graduation -d graduation2
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  graduation2_db:
  graduation2_uploads:
