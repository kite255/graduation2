services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graduation2
      POSTGRES_USER: graduation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - graduation2_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graduation -d graduation2"]
      interval: 5s
      retries: 10
volumes:
  graduation2_db:
