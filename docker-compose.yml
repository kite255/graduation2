
services:
  # ==========================================
  # FRONTEND — React + Nginx
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITES_BASE_DOMAIN: ${SITES_BASE_DOMAIN:-}

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

  # ==========================================
  # BACKEND — Node.js + Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      SITES_BASE_DOMAIN: ${SITES_BASE_DOMAIN:-}

      # PostgreSQL connection
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

      # Persistent image storage
      UPLOAD_DIR: /app/uploads

      # Temporary admin API authentication
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}

    volumes:
      - graduation2_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  # ==========================================
  # DATABASE — PostgreSQL 17
  # ==========================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: graduation2
      POSTGRES_USER: graduation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - graduation2_db:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U graduation -d graduation2

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

# ==========================================
# PERSISTENT STORAGE
# ==========================================
volumes:
  graduation2_db:
  graduation2_uploads:
